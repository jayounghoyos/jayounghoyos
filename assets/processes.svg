<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"><style>.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em}.s{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.blink{animation:b 1.4s steps(2) infinite}@keyframes b{50%{opacity:.15}}.bar{animation:w 3.2s ease-in-out infinite alternate}@keyframes w{from{transform:scaleX(.25)}to{transform:scaleX(1)}}</style><rect width="640" height="440" fill="#0d0c08"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0V24H0" fill="none" stroke="#2b2820" stroke-width=".5" opacity=".6"/></pattern></defs><rect width="640" height="440" fill="url(#g)"/><text x="28" y="44" class="m" font-size="11" fill="#c8d958">02 — RUNNING PROCESSES</text><text x="612" y="44" class="m" font-size="11" fill="#77705f" text-anchor="end">3 ACTIVE</text><text x="28" y="86" class="s" font-size="30" font-weight="600" fill="#efe7d7" letter-spacing="-.6">What I'm running now<tspan fill="#c8d958">.</tspan></text><rect x="28" y="118" width="584" height="96" fill="#16140d" stroke="#2b2820"/><circle class="blink" cx="46" cy="140" r="3.5" fill="#c8d958" style="animation-delay:0.0s"/><text x="58" y="144" class="m" font-size="10" fill="#77705f">PROC 01 · <tspan fill="#c8d958">RUNNING</tspan></text><text x="596" y="144" class="m" font-size="10" fill="#efe7d7" text-anchor="end">BUILDING</text><text x="44" y="170" class="s" font-size="14" fill="#a9a18f">A four-motor robot-frame vehicle, from</text><text x="44" y="189" class="s" font-size="14" fill="#a9a18f">Onshape CAD to the control stack.</text><g transform="translate(452 198)"><rect width="144" height="3" fill="#2b2820"/><rect class="bar" width="144" height="3" fill="#c8d958" style="transform-origin:0 0;animation-delay:0.0s"/></g><rect x="28" y="224" width="584" height="96" fill="#16140d" stroke="#2b2820"/><circle class="blink" cx="46" cy="246" r="3.5" fill="#c8d958" style="animation-delay:0.4s"/><text x="58" y="250" class="m" font-size="10" fill="#77705f">PROC 02 · <tspan fill="#c8d958">RUNNING</tspan></text><text x="596" y="250" class="m" font-size="10" fill="#efe7d7" text-anchor="end">STUDYING</text><text x="44" y="276" class="s" font-size="14" fill="#a9a18f">Transformers and optimization; classical</text><text x="44" y="295" class="s" font-size="14" fill="#a9a18f">robotics: kinematics and SLAM.</text><g transform="translate(452 304)"><rect width="144" height="3" fill="#2b2820"/><rect class="bar" width="144" height="3" fill="#c8d958" style="transform-origin:0 0;animation-delay:0.7s"/></g><rect x="28" y="330" width="584" height="96" fill="#16140d" stroke="#2b2820"/><circle class="blink" cx="46" cy="352" r="3.5" fill="#c8d958" style="animation-delay:0.8s"/><text x="58" y="356" class="m" font-size="10" fill="#77705f">PROC 03 · <tspan fill="#c8d958">RUNNING</tspan></text><text x="596" y="356" class="m" font-size="10" fill="#efe7d7" text-anchor="end">TRAINING</text><text x="44" y="382" class="s" font-size="14" fill="#a9a18f">An SO-101 arm with LeRobot: teleop,</text><text x="44" y="401" class="s" font-size="14" fill="#a9a18f">datasets and imitation-learning policies.</text><g transform="translate(452 410)"><rect width="144" height="3" fill="#2b2820"/><rect class="bar" width="144" height="3" fill="#c8d958" style="transform-origin:0 0;animation-delay:1.4s"/></g></svg>